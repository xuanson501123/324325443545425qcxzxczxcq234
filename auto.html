<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[ TIPTIP | T.me/gamemodios ]</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00ff88;
            --secondary: #00ccff;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Matrix background - giảm opacity */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.08;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        /* Terminal */
        .terminal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Header */
        .terminal-header {
            background: rgba(0, 255, 136, 0.05);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            text-align: center;
        }

        .terminal-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 3px;
        }

        /* Body */
        .terminal-body {
            padding: 32px 24px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 28px;
            font-size: 12px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 13px;
            pointer-events: none;
        }

        .terminal-input {
            width: 100%;
            padding: 14px 14px 14px 32px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: all 0.2s;
        }

        .terminal-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .terminal-input::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        .terminal-input.valid {
            border-color: var(--primary);
        }

        .terminal-input.error {
            border-color: #ff4444;
        }

        /* Validation message */
        .validation-msg {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
        }

        .validation-msg.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--primary);
        }

        .validation-msg.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.05);
            color: var(--primary);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--bg-dark);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--secondary);
            border-color: var(--secondary);
            color: var(--bg-dark);
        }

        /* Info box */
        .info-box {
            background: rgba(0, 204, 255, 0.05);
            border: 1px solid rgba(0, 204, 255, 0.2);
            border-radius: 6px;
            padding: 16px;
            font-size: 12px;
            line-height: 1.8;
            color: var(--text-dim);
        }

        .info-box strong {
            color: var(--secondary);
        }

        /* Loading */
        .loading-section {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(0, 255, 136, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: var(--text);
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-dark);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Result */
        .result-section {
            text-align: center;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 28px;
            letter-spacing: 2px;
        }

        .key-box {
            background: var(--bg-dark);
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 24px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .key-box:hover {
            border-color: var(--secondary);
            background: rgba(0, 255, 136, 0.03);
        }

        .key-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .key-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            word-break: break-all;
            line-height: 1.6;
        }

        .key-hint {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 12px;
        }

        .copy-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--primary);
            color: var(--bg-dark);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        .result-info {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: left;
        }

        .result-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .result-info-row:last-child {
            margin-bottom: 0;
        }

        .result-info-label {
            color: var(--text-dim);
        }

        .result-info-value {
            color: var(--text);
            font-weight: bold;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--text-dim);
            opacity: 0.6;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        /* Mobile */
        @media (max-width: 640px) {
            .terminal-body {
                padding: 24px 16px;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }

            .logo-text {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <!-- Matrix Background -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Main Container -->
    <div class="container">
        <div class="terminal">
            <!-- Header -->
            <div class="terminal-header">
                <div class="terminal-title">TIPTIP | T.ME/GAMEMODIOS</div>
            </div>

            <!-- Body -->
            <div class="terminal-body">
                <!-- Logo -->
                <div class="logo">
                    <div class="logo-text">KEYGEN</div>
                    <div class="logo-subtitle">Genkey All Game TipTip</div>
                </div>

                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="status-left">
                        <div class="status-dot"></div>
                        <span>ONLINE</span>
                    </div>
                    <div id="statusText">READY</div>
                </div>

                <!-- INPUT PANEL -->
                <div id="inputPanel">
                    <div class="form-group">
                        <label class="form-label">Device Identifier</label>
                        <div class="input-wrapper">
                            <span class="input-prefix">$</span>
                            <input type="text" id="udidInput" class="terminal-input" placeholder="Enter UDID or UUID"
                                autocomplete="off" spellcheck="false">
                        </div>
                        <div class="validation-msg hidden" id="validationMsg"></div>
                    </div>

                    <div class="btn-group">
                        <button class="btn" onclick="pasteClipboard()">PASTE</button>
                        <button class="btn btn-primary" id="generateBtn" onclick="startGeneration()" disabled>
                            GENERATE KEY
                        </button>
                    </div>

                    <div class="info-box">
                        <strong>How to get UDID:</strong><br>
                        Open TipTip game → Home menu → Copy UDID → Paste here
                    </div>
                </div>

                <!-- LOADING PANEL -->
                <div id="loadingPanel" class="hidden">
                    <div class="loading-section">
                        <div class="spinner"></div>
                        <div class="loading-text" id="loadingText">Generating key...</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>

                <!-- RESULT PANEL -->
                <div id="resultPanel" class="hidden">
                    <div class="result-section">
                        <div class="result-icon">[OK]</div>
                        <div class="result-title">KEY GENERATED</div>

                        <div class="key-box" onclick="copyKey()">
                            <div class="key-label">Your Key</div>
                            <div class="key-value" id="keyValue">—</div>
                            <div class="key-hint">Click to copy</div>
                            <div class="copy-feedback" id="copyFeedback">COPIED</div>
                        </div>

                        <div class="result-info">
                            <div class="result-info-row">
                                <span class="result-info-label">UDID:</span>
                                <span class="result-info-value" id="resultUdid">—</span>
                            </div>
                            <div class="result-info-row">
                                <span class="result-info-label">Expires:</span>
                                <span class="result-info-value" id="expiryTime">—</span>
                            </div>
                            <div class="result-info-row">
                                <span class="result-info-label">Status:</span>
                                <span class="result-info-value" style="color: var(--primary)">ACTIVE</span>
                            </div>
                        </div>

                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="copyKey()">COPY</button>
                            <button class="btn" onclick="resetSystem()">NEW KEY</button>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="footer">TIPTIP © 2026</div>
            </div>
        </div>
    </div>

    <script>
        // Matrix background - slower and lighter
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 80);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Main logic
        const urlParams = new URLSearchParams(window.location.search);
        const indexCode = urlParams.get('code');
        let deviceId = urlParams.get('udid') || '';
        let deviceKind = 'uuid'; // Thêm biến này
        let generatedKey = '';
        let isCodeValid = false;

        // XOR encryption key (multi-layer obfuscation)
        const _x = [75, 29, 57, 46, 145, 170, 173, 20, 38, 54, 144, 160, 175, 26, 38, 36, 149, 190, 173, 45, 61, 55, 170, 174, 182, 43, 55, 47, 168, 184, 175];
        const _s = 42;
        const HELLO_TIPTIP = String.fromCharCode(..._x.map((c, i) => c ^ ((i * _s) % 256)));

        // XOR decrypt function
        function xorDecrypt(data, key) {
            const result = new Uint8Array(data.length);
            for (let i = 0; i < data.length; i++) {
                result[i] = data[i] ^ key.charCodeAt(i % key.length);
            }
            return result;
        }

        // Decrypt JSON data from base64
        function decryptJsonData(encryptedData, key) {
            try {
                // Decode base64
                const binaryString = atob(encryptedData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // XOR decrypt
                const decryptedBytes = xorDecrypt(bytes, key);

                // Convert to string
                const decoder = new TextDecoder('utf-8');
                const jsonString = decoder.decode(decryptedBytes);

                // Parse JSON
                return JSON.parse(jsonString);
            } catch (error) {
                console.error('Decryption error:', error);
                return null;
            }
        }

        // Check if code is valid for today
        async function checkCodeValidity() {
            if (!indexCode || !/^\d{9}$/.test(indexCode)) {
                showError('Invalid code format. Please use correct link from app');
                return false;
            }

            try {
                const response = await fetch('https://thespikecross.pages.dev/autotsc.json');
                const encryptedText = await response.text();

                // Decrypt the data
                const data = decryptJsonData(encryptedText.trim(), HELLO_TIPTIP);

                if (!data) {
                    showError('Unable to decrypt data. Please try again');
                    return false;
                }

                // Check if default key exists and has valid code
                if (data.default && data.default.index_code === indexCode) {
                    isCodeValid = true;
                    return true;
                } else {
                    const validCode = data.default ? data.default.index_code : 'N/A';
                    console.log('Expected code:', validCode, 'Got:', indexCode);
                    showError('Link Getkey expired. Please get a new link from app');
                    generateBtn.disabled = true;
                    return false;
                }
            } catch (error) {
                console.error('Error checking code:', error);
                showError('Unable to verify code. Please check your connection');
                return false;
            }
        }

        // Initialize
        if (deviceId) {
            document.getElementById('udidInput').value = deviceId;
        }

        // Check if indexCode exists and verify
        if (!indexCode || !/^\d{9}$/.test(indexCode)) {
            showError('Link Getkey expired. Please get a new link from app');
            generateBtn.disabled = true;
        } else {
            // Verify code on load
            checkCodeValidity().then(valid => {
                if (valid) {
                    // If UDID was pre-filled, validate it now
                    if (deviceId) {
                        validateInput();
                    }
                }
            });
        }

        function validateUdid(input) {
            const clean = input.trim().toUpperCase();

            if (/^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$/.test(clean)) {
                return { valid: true, type: 'UUID', clean, kind: 'uuid' };
            }

            if (/^[0-9A-F]{8}-[0-9A-F]{16}$/.test(clean)) {
                return { valid: true, type: 'UDID', clean, kind: 'udid_new' };
            }

            const stripped = clean.replace(/-/g, '');
            if (/^[0-9A-F]{40}$/.test(stripped)) {
                return { valid: true, type: 'UDID', clean, kind: 'udid_40' };
            }

            return { valid: false };
        }

        const udidInput = document.getElementById('udidInput');
        const generateBtn = document.getElementById('generateBtn');
        const validationMsg = document.getElementById('validationMsg');

        udidInput.addEventListener('input', validateInput);

        function validateInput() {
            const value = udidInput.value;

            if (!value.trim()) {
                udidInput.className = 'terminal-input';
                validationMsg.classList.add('hidden');
                generateBtn.disabled = true;
                document.getElementById('statusText').textContent = 'READY';
                return;
            }

            const result = validateUdid(value);

            if (result.valid) {
                udidInput.className = 'terminal-input valid';
                validationMsg.innerHTML = `Valid ${result.type} format`;
                validationMsg.className = 'validation-msg success';
                validationMsg.classList.remove('hidden');
                deviceId = result.clean;
                deviceKind = result.kind; // Lưu kind
                document.getElementById('statusText').textContent = 'READY';

                // Only enable button if code is also valid
                generateBtn.disabled = !isCodeValid;
            } else {
                udidInput.className = 'terminal-input error';
                validationMsg.innerHTML = 'Invalid format. Enter valid UDID or UUID';
                validationMsg.className = 'validation-msg error';
                validationMsg.classList.remove('hidden');
                generateBtn.disabled = true;
                document.getElementById('statusText').textContent = 'ERROR';
            }
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                udidInput.value = text.trim();
                validateInput();
            } catch (err) {
                alert('Clipboard access denied. Please paste manually');
            }
        }

        async function startGeneration() {
            if (!deviceId || !indexCode) {
                showError('Link Getkey expired. Please get a new link from app');
                return;
            }

            // Verify code again before generating
            const valid = await checkCodeValidity();
            if (!valid) {
                return;
            }

            document.getElementById('statusText').textContent = 'PROCESSING';
            showPanel('loadingPanel');

            const steps = [
                { text: 'Initializing...', progress: 25 },
                { text: 'Encrypting...', progress: 50 },
                { text: 'Generating...', progress: 75 },
                { text: 'Finalizing...', progress: 100 }
            ];

            let currentStep = 0;
            const interval = setInterval(() => {
                if (currentStep < steps.length) {
                    const step = steps[currentStep];
                    document.getElementById('loadingText').textContent = step.text;
                    document.getElementById('progressFill').style.width = step.progress + '%';
                    currentStep++;
                } else {
                    clearInterval(interval);
                    finishGeneration();
                }
            }, 500);
        }

        function finishGeneration() {
            generatedKey = generateKey(deviceId, indexCode);

            const tomorrow = new Date();
            tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
            tomorrow.setUTCHours(0, 15, 0, 0);
            const expiryStr = tomorrow.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });

            document.getElementById('keyValue').textContent = generatedKey;
            document.getElementById('resultUdid').textContent = deviceId.slice(0, 20) + '...';
            document.getElementById('expiryTime').textContent = expiryStr;
            document.getElementById('statusText').textContent = 'COMPLETE';

            showPanel('resultPanel');
        }

        function generateKey(udid, code) {
            const clean = udid.replace(/-/g, '').toUpperCase();
            const now = new Date();
            const y = now.getUTCFullYear();
            const m = String(now.getUTCMonth() + 1).padStart(2, '0');
            const d = String(now.getUTCDate()).padStart(2, '0');

            let part = '';

            if (deviceKind === 'udid_new' || deviceKind === 'udid_40') {
                // For UDID 8-16 format and 40-hex format: take last 10 chars
                const tail = clean.slice(-10);
                for (let i = 0; i < code.length; i++) {
                    const pos = parseInt(code[i]);
                    if (isNaN(pos)) continue;
                    part += tail[pos];
                }
            } else {
                // For UUID: repeat and pick based on code positions
                let buf = clean;
                while (buf.length < 40) buf += clean;
                for (let i = 0; i < code.length; i++) {
                    const pos = parseInt(code[i]);
                    if (isNaN(pos)) continue;
                    part += buf[pos % buf.length];
                }
            }

            return `TipTip-${y}${m}${d}-${part}`;
        }

        function copyKey() {
            const keyText = document.getElementById('keyValue').textContent;
            const feedback = document.getElementById('copyFeedback');

            if (navigator.clipboard) {
                navigator.clipboard.writeText(keyText).then(() => {
                    showCopyFeedback(feedback);
                }).catch(() => {
                    fallbackCopy(keyText, feedback);
                });
            } else {
                fallbackCopy(keyText, feedback);
            }
        }

        function fallbackCopy(text, feedback) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showCopyFeedback(feedback);
        }

        function showCopyFeedback(element) {
            element.classList.add('show');
            setTimeout(() => {
                element.classList.remove('show');
            }, 1200);
        }

        function showPanel(panelId) {
            document.getElementById('inputPanel').classList.add('hidden');
            document.getElementById('loadingPanel').classList.add('hidden');
            document.getElementById('resultPanel').classList.add('hidden');
            document.getElementById(panelId).classList.remove('hidden');
        }

        function resetSystem() {
            udidInput.value = '';
            validateInput();
            showPanel('inputPanel');
            document.getElementById('statusText').textContent = 'READY';
            document.getElementById('progressFill').style.width = '0%';
        }

        function showError(message) {
            validationMsg.innerHTML = message;
            validationMsg.className = 'validation-msg error';
            validationMsg.classList.remove('hidden');
        }
    </script>
</body>

</html>
